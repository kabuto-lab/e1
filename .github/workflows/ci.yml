name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-checks:
    name: Project checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    # Disposable, empty database for session-security.spec.ts only. No production
    # secrets, application migrations, seed data, or uploaded media are used.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: security_auth_test
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d security_auth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use the repository npm version
        run: npm install --global npm@10.9.0

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Build all workspaces and run all checks
        run: node scripts/verify-worktree.mjs
        env:
          SECURITY_TEST_DATABASE_URL: postgresql://ci:ci-only-not-a-secret@127.0.0.1:5432/security_auth_test
