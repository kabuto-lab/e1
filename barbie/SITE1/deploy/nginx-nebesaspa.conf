# nebesaspa.com — боевой домен тенанта nebesaspa (NAS).
# Отдаёт СНИМОК (статику) из /var/www/nebesaspa.com, сгенерированный
# scripts/publish-snapshot.mjs из root-режимного рендера тенанта.
# TLS терминируется на haproxy хоста; сюда (.31:80) приходит уже расшифрованный
# HTTP с Host: nebesaspa.com → name-based vhost (рядом с /nas default_server).
# Ставится: cp deploy/nginx-nebesaspa.conf /etc/nginx/sites-available/nebesaspa.com
#           ln -sf ../sites-available/nebesaspa.com /etc/nginx/sites-enabled/
server {
  listen 80;
  server_name nebesaspa.com www.nebesaspa.com;
  root /var/www/nebesaspa.com;
  index index.html;
  client_max_body_size 25m;

  # Фото девушек — живьём из MinIO (в снимок не вмораживаются).
  location /media/ {
    proxy_pass http://127.0.0.1:9011/barbie-media/;
  }

  # API — для интерактива (формы); SSR-контент уже вморожен в HTML.
  location /v1/ {
    proxy_pass http://127.0.0.1:5110/v1/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
  location /api/ {
    proxy_pass http://127.0.0.1:5110/api/;
    proxy_set_header Host $host;
  }

  # Билд-ассеты Next — immutable.
  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Статика тенанта/каталога — кэш на сутки.
  location ~ ^/(tenants|model-library|vendor|fonts)/ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
    try_files $uri =404;
  }

  # Маршруты снимка сохранены как <route>/index.html. Отдаём index.html напрямую
  # ($uri/index.html ДО $uri/, иначе nginx 301-редиректит директорию на слэш).
  location / {
    try_files $uri $uri/index.html $uri.html /index.html;
  }
}
