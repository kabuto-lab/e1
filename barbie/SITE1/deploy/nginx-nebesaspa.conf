# nebesaspa.com — боевой домен тенанта nebesaspa (NAS).
# РЕЖИМ: динамический прокси на ЖИВОЙ root-инстанс :5112 (НЕ статика).
# Раньше отдавался СНИМОК (статика) из /var/www/nebesaspa.com (publish-snapshot.mjs).
# С приходом i18n (next-intl, 2026-06-15) снимок СЛОМАЛСЯ: сервер отдавал 200, но клиент
# падал при гидратации (Application error: client-side exception) из-за ремапа /nebesaspa→/
# — middleware-роутинг next-intl на статике отсутствует. Live-инстанс отдаёт тенанта по
# реальному пути /nebesaspa, путь совпадает с роутом → гидратация ОК.
# Цена: публичный URL показывает /nebesaspa (корень редиректит на /nebesaspa).
# TLS терминируется на haproxy хоста; сюда (.31:80) приходит расшифрованный HTTP с Host: nebesaspa.com.
# Ставится: cp deploy/nginx-nebesaspa.conf /etc/nginx/sites-available/nebesaspa.com
#           ln -sf ../sites-available/nebesaspa.com /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Откат на статику: cp /etc/nginx/sites-available/nebesaspa.com.bak-static /etc/nginx/sites-available/nebesaspa.com && nginx -s reload
#   (плюс восстановить /var/www/nebesaspa.com из *.bak-<дата> — pre-i18n снимок)
# TODO: виджет контактов на домене мёртв — клиентский бандл root зашит на 127.0.0.1:5110.
#   Фикс: пересобрать root-инстанс с относительным API (NEXT_PUBLIC_API_URL пустой/ /v1),
#   /v1/ уже проксируется в :5110 ниже → клиент пойдёт same-origin и заработает.
server {
  listen 80;
  server_name nebesaspa.com www.nebesaspa.com;
  client_max_body_size 25m;
  absolute_redirect off;   # держим редиректы относительными → сохраняется https (TLS на haproxy)

  # Фото девушек — живьём из MinIO.
  location /media/ {
    proxy_pass http://127.0.0.1:9011/barbie-media/;
  }

  # API — для интерактива (формы, touchpoints).
  location /v1/ {
    proxy_pass http://127.0.0.1:5110/v1/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
  location /api/ {
    proxy_pass http://127.0.0.1:5110/api/;
    proxy_set_header Host $host;
  }

  # Корень домена → тенант nebesaspa на live-инстансе.
  location = / {
    return 302 /nebesaspa;
  }

  # Всё остальное (/nebesaspa/*, /_next/*, /tenants/*, /fonts/*, /vendor/*, /model-library/*)
  # — на живой root-инстанс :5112 (SSR + i18n middleware работают).
  location / {
    proxy_pass http://127.0.0.1:5112;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
