# nebesaspa.com — боевой домен тенанта nebesaspa (NAS).
# РЕЖИМ: динамический прокси на ЖИВОЙ root-tenant инстанс :5112 (НЕ статика).
#
# Тенант смонтирован В КОРЕНЬ домена: https://nebesaspa.com/ (без хвоста /nebesaspa).
# Это обеспечивается СБОРКОЙ инстанса :5112 с NEXT_PUBLIC_ROOT_TENANT=nebesaspa —
# middleware (apps/web/src/middleware.ts) переписывает корневые пути на физический
# маршрут /<locale>/nebesaspa/... с сохранением видимого URL, а старые /nebesaspa/*
# 301-редиректит на чистый корень. next-intl работает на реальном маршруте →
# гидратация не ломается (в отличие от прежнего статического снимка с ремапом).
#
# История: раньше отдавался СНИМОК (статика) из /var/www/nebesaspa.com; с приходом
# i18n он сломался при гидратации. Затем — прокси на :5112, но с видимым /nebesaspa
# (корень редиректил на /nebesaspa). Теперь — чистый корень (root-tenant сборка).
#
# TLS терминируется на haproxy хоста; сюда (.31:80) приходит расшифрованный HTTP с Host: nebesaspa.com.
#
# Сборка/запуск root-tenant инстанса :5112 (источник домена):
#   cd /opt/e1/barbie/SITE1
#   NEXT_PUBLIC_ROOT_TENANT=nebesaspa NEXT_PUBLIC_BASE_PATH= \
#     NEXT_PUBLIC_API_URL=http://127.0.0.1:5110 NEXT_DISTDIR=.next-root \
#     npm run build -w @barbie-site1/web
#   pm2 delete nas-web-root 2>/dev/null; \
#   NEXT_PUBLIC_ROOT_TENANT=nebesaspa NEXT_PUBLIC_BASE_PATH= NEXT_DISTDIR=.next-root \
#     NEXT_PUBLIC_API_URL=http://127.0.0.1:5110 \
#     pm2 start node_modules/next/dist/bin/next --name nas-web-root --interpreter node \
#     --cwd /opt/e1/barbie/SITE1/apps/web -- start -p 5112
#
# Ставится: cp deploy/nginx-nebesaspa.conf /etc/nginx/sites-available/nebesaspa.com
#           ln -sf ../sites-available/nebesaspa.com /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
# Откат: предыдущая версия конфига возвращала 302 / → /nebesaspa (см. git history этого файла).
server {
  listen 80;
  server_name nebesaspa.com www.nebesaspa.com;
  client_max_body_size 25m;
  absolute_redirect off;   # держим редиректы относительными → сохраняется https (TLS на haproxy)

  # Фото девушек — живьём из MinIO.
  location /media/ {
    proxy_pass http://127.0.0.1:9011/barbie-media/;
  }

  # API — для интерактива (формы, touchpoints).
  location /v1/ {
    proxy_pass http://127.0.0.1:5110/v1/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }
  location /api/ {
    proxy_pass http://127.0.0.1:5110/api/;
    proxy_set_header Host $host;
  }

  # Всё (корень, /girls, /programs, /_next/*, /tenants/*, /fonts/*, ...) — на живой
  # root-tenant инстанс :5112. Тенант nebesaspa отдаётся прямо на корне домена.
  location / {
    proxy_pass http://127.0.0.1:5112;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
