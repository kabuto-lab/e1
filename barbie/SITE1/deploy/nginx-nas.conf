# NAS · nginx vhost на VM 192.168.125.31 (за haproxy хоста zomro).
# Демультиплексирует входящий /nas/... по портам стека:
#   /nas/v1, /nas/api -> NestJS API (5110)
#   /nas/media        -> MinIO bucket barbie-media (9011)
#   /nas/             -> Next.js web с basePath=/nas (5111)
# Ставится: cp deploy/nginx-nas.conf /etc/nginx/sites-available/nas
server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 50m;

  location /nas/v1/ {
    proxy_pass http://127.0.0.1:5110/v1/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location /nas/api/ {
    proxy_pass http://127.0.0.1:5110/api/;
    proxy_set_header Host $host;
  }

  location /nas/media/ {
    proxy_pass http://127.0.0.1:9011/barbie-media/;
  }

  # Статика тенантов/каталога/вендора — отдаём С ДИСКА напрямую, минуя Node.
  # До этого public/* шли через next start (~2.7 c на файл, без кэша); nginx с
  # диска отдаёт за <50 мс + ETag/Last-Modified → дешёвые 304. Префиксы длиннее
  # «/nas/», поэтому longest-prefix-match отдаёт им приоритет над прокси в Next.
  location /nas/tenants/ {
    alias /opt/e1/barbie/SITE1/apps/web/public/tenants/;
    add_header Cache-Control "public, max-age=86400";
    access_log off;
    try_files $uri =404;
  }

  location /nas/model-library/ {
    alias /opt/e1/barbie/SITE1/apps/web/public/model-library/;
    add_header Cache-Control "public, max-age=86400";
    access_log off;
    try_files $uri =404;
  }

  location /nas/vendor/ {
    alias /opt/e1/barbie/SITE1/apps/web/public/vendor/;
    add_header Cache-Control "public, max-age=604800, immutable";
    access_log off;
    try_files $uri =404;
  }

  # /nas (без слэша) — проксируем прямо в Next (basePath=/nas, trailingSlash=false).
  # НЕ редиректить на /nas/ — иначе петля: nginx→/nas/ ↔ Next 308→/nas.
  location = /nas {
    proxy_pass http://127.0.0.1:5111;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location /nas/ {
    proxy_pass http://127.0.0.1:5111;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
