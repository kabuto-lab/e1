# NAS · nginx vhost на VM 192.168.125.31 (за haproxy хоста zomro).
# Демультиплексирует входящий /nas/... по портам стека:
#   /nas/v1, /nas/api -> NestJS API (5110)
#   /nas/media        -> MinIO bucket barbie-media (9011)
#   /nas/             -> Next.js web с basePath=/nas (5111)
# Ставится: cp deploy/nginx-nas.conf /etc/nginx/sites-available/nas
server {
  listen 80 default_server;
  server_name _;
  client_max_body_size 50m;

  location /nas/v1/ {
    proxy_pass http://127.0.0.1:5110/v1/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
  }

  location /nas/api/ {
    proxy_pass http://127.0.0.1:5110/api/;
    proxy_set_header Host $host;
  }

  location /nas/media/ {
    proxy_pass http://127.0.0.1:9011/barbie-media/;
  }

  location = /nas { return 301 /nas/; }

  location /nas/ {
    proxy_pass http://127.0.0.1:5111;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
