name: mymuse-handoff-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mymuse_dev
      POSTGRES_DB: mymuse_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Generate the local .env first}
    ports:
      - "127.0.0.1:15434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mymuse_dev -d mymuse_dev"]
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16384:6379"
    volumes:
      - redis_data:/data
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Generate the local .env first}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Generate the local .env first}
    ports:
      - "127.0.0.1:19004:9000"
      - "127.0.0.1:19005:9001"
    volumes:
      - minio_data:/data
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "127.0.0.1:11026:1025"
      - "127.0.0.1:18026:8025"
volumes:
  postgres_data:
  redis_data:
  minio_data:
